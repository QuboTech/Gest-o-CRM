<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trocar senha — CRP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark" role="img" aria-label="CRP">
      <svg class="bm-icon" viewBox="0 0 300 300" aria-hidden="true">
        <g class="bm-icon-lines">
          <line x1="150" y1="40" x2="235" y2="95" stroke-width="6"/>
          <line x1="150" y1="40" x2="55" y2="105" stroke-width="6"/>
          <line x1="55" y1="105" x2="35" y2="205" stroke-width="6"/>
          <line x1="235" y1="95" x2="155" y2="210" stroke-width="6"/>
          <line x1="100" y1="150" x2="155" y2="210" stroke-width="6"/>
          <line x1="35" y1="205" x2="100" y2="150" stroke-width="6"/>
          <line x1="155" y1="210" x2="150" y2="145" stroke-width="6"/>
          <line x1="155" y1="210" x2="190" y2="255" stroke-width="6"/>
          <line x1="155" y1="210" x2="85" y2="255" stroke-width="6"/>
          <path d="M 117 245 A 42 42 0 0 1 190 244" stroke-width="6"/>
        </g>
        <g class="bm-icon-rings">
          <circle cx="235" cy="95" r="14" stroke-width="9"/>
          <circle cx="55" cy="105" r="11" stroke-width="7"/>
          <circle cx="100" cy="150" r="10" stroke-width="6"/>
          <circle cx="155" cy="210" r="20" stroke-width="11"/>
          <circle cx="150" cy="145" r="11" stroke-width="7"/>
          <circle cx="190" cy="255" r="10" stroke-width="6"/>
        </g>
        <g class="bm-icon-dots">
          <circle cx="150" cy="40" r="16"/>
          <circle cx="35" cy="205" r="15"/>
          <circle cx="85" cy="255" r="15"/>
        </g>
      </svg>
      <span class="bm-word" aria-hidden="true">CRP</span>
    </div>
    <h1 id="page-title">Defina sua nova senha</h1>
    <p style="text-align:center; color:var(--gray-400); font-size:0.85rem; margin-top:-16px; margin-bottom:20px;" id="page-subtitle">
      Por segurança, você precisa trocar a senha temporária antes de continuar.
    </p>

    <form id="change-form">
      <div class="form-field" style="margin-bottom:14px;">
        <label for="new-password">Nova senha</label>
        <input type="password" id="new-password" name="new-password" autocomplete="new-password" required minlength="8">
        <span class="hint">Mínimo de 8 caracteres.</span>
      </div>
      <div class="form-field" style="margin-bottom:20px;">
        <label for="confirm-password">Confirmar nova senha</label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="8">
      </div>
      <p id="change-error" class="error-message" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="change-btn">Salvar nova senha</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script>
  (async function () {
    var auth = await window.ADMIN_AUTH_READY;
    if (!auth) return; // já foi redirecionado

    if (!auth.profile.must_change_password) {
      document.getElementById('page-title').textContent = 'Trocar senha';
      document.getElementById('page-subtitle').textContent = 'Defina uma nova senha para sua conta.';
    }

    document.getElementById('change-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var newPassword = document.getElementById('new-password').value;
      var confirmPassword = document.getElementById('confirm-password').value;
      var errorEl = document.getElementById('change-error');
      var btn = document.getElementById('change-btn');

      errorEl.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'As senhas não coincidem.';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      var { error: updateError } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (updateError) {
        errorEl.textContent = 'Não foi possível trocar a senha: ' + updateError.message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
        return;
      }

      await supabaseClient
        .from('profiles')
        .update({ must_change_password: false })
        .eq('id', auth.session.user.id);

      location.href = 'pedido.html';
    });
  })();
</script>
</body>
</html>
