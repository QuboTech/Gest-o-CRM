<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CRP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark" role="img" aria-label="CRP">
      <svg class="bm-icon" viewBox="0 0 300 300" aria-hidden="true">
        <g class="bm-icon-lines">
          <line x1="150" y1="40" x2="235" y2="95" stroke-width="6"/>
          <line x1="150" y1="40" x2="55" y2="105" stroke-width="6"/>
          <line x1="55" y1="105" x2="35" y2="205" stroke-width="6"/>
          <line x1="235" y1="95" x2="155" y2="210" stroke-width="6"/>
          <line x1="100" y1="150" x2="155" y2="210" stroke-width="6"/>
          <line x1="35" y1="205" x2="100" y2="150" stroke-width="6"/>
          <line x1="155" y1="210" x2="150" y2="145" stroke-width="6"/>
          <line x1="155" y1="210" x2="190" y2="255" stroke-width="6"/>
          <line x1="155" y1="210" x2="85" y2="255" stroke-width="6"/>
          <path d="M 117 245 A 42 42 0 0 1 190 244" stroke-width="6"/>
        </g>
        <g class="bm-icon-rings">
          <circle cx="235" cy="95" r="14" stroke-width="9"/>
          <circle cx="55" cy="105" r="11" stroke-width="7"/>
          <circle cx="100" cy="150" r="10" stroke-width="6"/>
          <circle cx="155" cy="210" r="20" stroke-width="11"/>
          <circle cx="150" cy="145" r="11" stroke-width="7"/>
          <circle cx="190" cy="255" r="10" stroke-width="6"/>
        </g>
        <g class="bm-icon-dots">
          <circle cx="150" cy="40" r="16"/>
          <circle cx="35" cy="205" r="15"/>
          <circle cx="85" cy="255" r="15"/>
        </g>
      </svg>
      <span class="bm-word" aria-hidden="true">CRP</span>
    </div>
    <h1>Portal Administrativo</h1>

    <form id="login-form">
      <div class="form-field" style="margin-bottom:14px;">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-field" style="margin-bottom:20px;">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="error-message" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('login-error');
    var btn = document.getElementById('login-btn');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    var { error } = await supabaseClient.auth.signInWithPassword({
      email: usernameToEmail(username),
      password: password
    });

    if (error) {
      errorEl.textContent = 'Usuário ou senha inválidos.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    location.href = 'pedido.html';
  });
</script>
</body>
</html>
