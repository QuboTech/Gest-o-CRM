<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — CRP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <div class="login-card">
    <div class="brand-mark" role="img" aria-label="CRP">
      <svg class="bm-icon" viewBox="0 0 200 160" aria-hidden="true">
        <g class="bm-icon-lines">
          <line x1="100" y1="20" x2="55" y2="70"/>
          <line x1="100" y1="20" x2="145" y2="70"/>
          <line x1="55" y1="70" x2="75" y2="120"/>
          <line x1="145" y1="70" x2="125" y2="120"/>
          <line x1="75" y1="120" x2="125" y2="120"/>
          <line x1="100" y1="20" x2="100" y2="120"/>
        </g>
        <g class="bm-icon-dots">
          <circle cx="100" cy="20" r="10"/>
          <circle cx="55" cy="70" r="8"/>
          <circle cx="145" cy="70" r="8"/>
          <circle cx="75" cy="120" r="8"/>
          <circle cx="125" cy="120" r="8"/>
          <circle cx="100" cy="120" r="8"/>
        </g>
      </svg>
      <span class="bm-word" aria-hidden="true">CRP</span>
    </div>
    <h1>Portal Administrativo</h1>

    <form id="login-form">
      <div class="form-field" style="margin-bottom:14px;">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-field" style="margin-bottom:20px;">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="error-message" style="display:none;"></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/admin-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value;
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('login-error');
    var btn = document.getElementById('login-btn');

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    var { error } = await supabaseClient.auth.signInWithPassword({
      email: usernameToEmail(username),
      password: password
    });

    if (error) {
      errorEl.textContent = 'Usuário ou senha inválidos.';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    location.href = 'pedido.html';
  });
</script>
</body>
</html>
